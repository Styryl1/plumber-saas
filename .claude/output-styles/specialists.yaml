# RESEARCH-ONLY SPECIALIST CONFIGURATION v4.0 - ChatGPT Integration
version: "4.0.0"
auto_activation: true
research_only_mode: true  # NEW: Agents do research only, no implementation

# ChatGPT COLLABORATION MODEL
collaboration_model:
  chatgpt_responsibilities: ["PRP planning", "super prompts", "TypeScript error resolution", "architecture decisions"]
  claude_responsibilities: ["implementation execution", "file management", "MCP integration", "code execution"]
  agent_responsibilities: ["documentation lookup", "pattern research", "examples only"]
  
# RESEARCH TRANSPARENCY & SOURCE SELECTION
research_transparency:
  enabled: true
  show_process: true
  explain_source_selection: true
  research_only_warning: true  # NEW: Remind that agents only research
  
  output_format: |
    🤖 DELEGATING TO: {agent_name} (RESEARCH ONLY)
    📍 Agent searching: {source_name}
    🎯 Why selected: {selection_reason}
    📝 Found: {findings_summary}
    ⚠️  Note: Agent provides research only - implementation via Claude following ChatGPT super prompt

# CORE SPECIALISTS (8 total)
specialists:
  ui-specialist-agent:
    keywords: ["ui", "component", "tailwind", "schedule-x", "mobile", "calendar", "design"]
    confidence_threshold: 0.70
    file_patterns: ["*UI*.md", "*COMPONENT*.md", "*DESIGN*.md"]
    tools: ["Context7 MCP", "Firecrawl MCP", "Playwright MCP", "shadcn MCP"]
    focus: "RESEARCH ONLY - shadcn/ui component examples, Dutch UX patterns, Schedule-X documentation"
    mode: "research_only"  # NEW: Explicit research-only mode
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true  # NEW: No implementation suggestions
      source_priority:
        1: "shadcn MCP for UI component documentation"
        2: "Context7 for latest Tailwind/React patterns"  
        3: "Firecrawl for working Schedule-X examples"
      selection_reasoning:
        shadcn: "Documentation for standardized UI components"
        context7: "Latest framework documentation research"
        firecrawl: "Working examples from production sites for reference"
      output_format: "documentation_and_examples_only"  # NEW: No implementation advice
    
  t3-specialist-agent:
    keywords: ["dashboard", "component", "form", "data", "save", "load", "page", "feature", "system", "integration", "backend", "frontend", "database", "api", "next", "trpc", "typescript", "react", "prisma", "t3"]
    confidence_threshold: 0.50  # Lower threshold - should activate for most features
    file_patterns: ["*T3*.md", "*API*.md", "*ARCHITECTURE*.md", "*COMPONENT*.md", "*FORM*.md"]
    tools: ["Context7 MCP", "Playwright MCP", "Supabase MCP"]
    focus: "RESEARCH ONLY - Next.js App Router docs, tRPC documentation lookup, TypeScript pattern examples"
    mode: "research_only"  # NEW: Explicit research-only mode
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true  # NEW: No implementation suggestions
      source_priority:
        1: "Context7 for Next.js latest App Router documentation"
        2: "Context7 for tRPC current documentation"
        3: "Supabase MCP for database integration examples"
      selection_reasoning:
        context7_nextjs: "Latest Next.js App Router documentation research"
        context7_trpc: "Current tRPC patterns and API reference"
        supabase_mcp: "Database integration documentation lookup"
      output_format: "documentation_and_examples_only"  # NEW: No implementation advice
    research_triggers_for:  # NEW: Research triggers instead of implementation
      - "dashboard functionality documentation needed"
      - "data patterns research required"
      - "form implementation examples needed"
      - "backend integration documentation lookup" 
      - "component patterns research"
    business_research_triggers:  # NEW: Business context research
      - "customer management patterns"
      - "job scheduling examples" 
      - "invoice system documentation"
      - "booking form patterns"
      - "authentication flow examples"
    
  database-specialist-agent:
    keywords: ["supabase", "prisma", "rls", "migration", "postgresql", "query"]
    confidence_threshold: 0.70
    file_patterns: ["*DATABASE*.md", "*SUPABASE*.md", "*RLS*.md"]
    tools: ["Supabase MCP", "Context7 MCP"]
    focus: "RESEARCH ONLY - Supabase docs, RLS policy examples, GDPR compliance patterns"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Supabase MCP for database documentation"
        2: "Context7 for PostgreSQL optimization examples"
      selection_reasoning:
        supabase_mcp: "Database schema and RLS policy documentation"
        context7: "PostgreSQL and optimization pattern research"
      output_format: "documentation_and_examples_only"
    
  ai-specialist-agent:
    keywords: ["gpt", "claude", "prompt", "ai", "chat", "voice", "personality", "vercel", "ai-sdk"]
    confidence_threshold: 0.70
    file_patterns: ["*AI*.md", "*PROMPT*.md", "*CHAT*.md"]
    tools: ["Context7 MCP", "Firecrawl MCP"]
    focus: "RESEARCH ONLY - Vercel AI SDK documentation, Dutch AI examples, emergency detection patterns"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Context7 for Vercel AI SDK documentation"
        2: "Firecrawl for AI chat implementation examples"
      selection_reasoning:
        context7_ai: "Vercel AI SDK documentation and pattern research"
        firecrawl_examples: "AI chat implementation examples for reference"
      output_format: "documentation_and_examples_only"
    
  auth-specialist-agent:
    keywords: ["clerk", "auth", "organization", "permission", "user", "security"]
    confidence_threshold: 0.70
    file_patterns: ["*AUTH*.md", "*SECURITY*.md", "*USER*.md"]
    tools: ["Clerk MCP", "Context7 MCP"]
    focus: "RESEARCH ONLY - Clerk documentation, multi-tenant patterns, Dutch business validation"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Clerk MCP for authentication documentation"
        2: "Context7 for Clerk middleware examples"
      selection_reasoning:
        clerk_mcp: "Clerk organization and user management documentation"
        context7_auth: "Clerk middleware and security pattern research"
      output_format: "documentation_and_examples_only"
    
  payment-specialist-agent:
    keywords: ["mollie", "ideal", "payment", "invoice", "btw", "billing"]
    confidence_threshold: 0.70
    file_patterns: ["*PAYMENT*.md", "*INVOICE*.md", "*BTW*.md"]
    tools: ["Context7 MCP", "Firecrawl MCP"]
    focus: "RESEARCH ONLY - Mollie API docs, BTW compliance examples, invoicing patterns"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Context7 for Mollie API documentation"
        2: "Firecrawl for Dutch payment implementation examples"
      selection_reasoning:
        context7_mollie: "Mollie API and iDEAL integration documentation"
        firecrawl_dutch: "Dutch BTW compliance examples for reference"
      output_format: "documentation_and_examples_only"
    
  ux-design-agent:
    keywords: ["conversion", "psychology", "journey", "booking", "funnel"]
    confidence_threshold: 0.70
    file_patterns: ["*UX*.md", "*CONVERSION*.md", "*JOURNEY*.md"]
    tools: ["Context7 MCP", "Firecrawl MCP", "Playwright MCP"]
    focus: "RESEARCH ONLY - Dutch UX research, conversion examples, behavioral patterns"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Firecrawl for Dutch customer journey examples"
        2: "Context7 for conversion optimization documentation"
        3: "Playwright for user behavior research"
      selection_reasoning:
        firecrawl_dutch: "Dutch customer psychology examples for reference"
        context7_conversion: "Conversion optimization pattern research"
        playwright_testing: "User journey validation examples"
      output_format: "documentation_and_examples_only"
    
  testing-specialist-agent:
    keywords: ["test", "validation", "e2e", "playwright", "automation"]
    confidence_threshold: 0.70
    file_patterns: ["*TEST*.md", "*VALIDATION*.md"]
    tools: ["Playwright MCP"]
    focus: "RESEARCH ONLY - Playwright examples, E2E patterns, zero-file testing"
    mode: "research_only"
    
    research_behavior:
      show_process: true
      explain_source_selection: true
      research_only_mode: true
      source_priority:
        1: "Playwright MCP for browser automation documentation"
      selection_reasoning:
        playwright_mcp: "Browser automation and E2E testing pattern research"
      output_format: "documentation_and_examples_only"

# ACTIVATION RULES
activation:
  strategy: "fuzzy_match"
  threshold: 0.70
  max_concurrent: 4
  emergency_mode:
    keywords: ["urgent", "quick", "fast", "asap", "emergency"]
    max_specialists: 2
    analysis_depth: "surface_level"

# COORDINATION with Smart Conflict Prevention
coordination:
  conflict_resolution: "present_options_to_user_with_recommendations"
  update_frequency: "after_successful_implementation"
  parallel_updates: true
  max_concurrent_updates: 3
  
  smart_conflict_prevention:
    enabled: true
    
    pre_assignment_checks:
      content_overlap_threshold: 0.4  # If 40%+ content overlap, flag potential conflict
      file_section_mapping:
        enabled: true
        strategy: "assign_different_sections_to_different_specialists"
        
    area_isolation_rules:
      dashboard_specialists: ["t3-specialist-agent", "ui-specialist-agent", "database-specialist-agent", "auth-specialist-agent"]
      widget_specialists: ["ui-specialist-agent", "ux-design-agent", "ai-instruction-agent"]
      ai_core_specialists: ["ai-instruction-agent", "ux-design-agent"]
      marketplace_specialists: ["ux-design-agent", "database-specialist-agent"]
      cross_area_specialists: ["testing-specialist-agent", "payment-specialist-agent"]  # Can work across areas
      
    cross_area_coordination:
      enabled: true
      multi_area_detection:
        keywords_that_trigger:
          - "integration between" 
          - "widget and dashboard"
          - "ai chat on dashboard"
          - "marketplace overflow"
          - "cross-platform"
          - "end-to-end flow"
        
      coordination_strategies:
        widget_dashboard_integration:
          primary_area: "widget"
          secondary_area: "dashboard"
          shared_specialists: ["ui-specialist-agent", "t3-specialist-agent"]
          coordination_pattern: "widget_leads_dashboard_adapts"
          
        ai_personality_everywhere:
          areas: ["widget", "dashboard", "ai-core"]
          lead_specialist: "ai-instruction-agent"
          support_specialists: ["ux-design-agent"]
          coordination_pattern: "consistent_personality_across_touchpoints"
          
        payment_flow_complete:
          areas: ["widget", "dashboard", "marketplace"]
          lead_specialist: "payment-specialist-agent"
          support_specialists: ["ux-design-agent", "database-specialist-agent"]
          coordination_pattern: "end_to_end_payment_experience"
          
        emergency_dispatch_system:
          areas: ["widget", "dashboard", "marketplace", "ai-core"]
          coordination_type: "real_time_data_flow"
          specialists: ["ai-instruction-agent", "database-specialist-agent", "ux-design-agent"]
      
      coordination_workflow:
        1: "detect_multi_area_requirement"
        2: "identify_lead_area_and_specialist"
        3: "activate_supporting_areas_and_specialists"
        4: "establish_coordination_channels"
        5: "synchronized_implementation_with_handoffs"
        6: "cross_area_validation_and_testing"
      
    specialist_expertise_boundaries:
      ui-specialist-agent:
        owns: ["component design", "responsive layouts", "calendar integration"]
        collaborates_on: ["user experience patterns", "mobile optimization"]
        defers_to: "t3-specialist-agent for tRPC integration"
        
      t3-specialist-agent:
        owns: ["architecture decisions", "tRPC procedures", "TypeScript patterns"]
        collaborates_on: ["API design", "database integration"]
        defers_to: "database-specialist-agent for RLS policies"
        
      database-specialist-agent:
        owns: ["RLS policies", "query optimization", "migration strategies"]
        collaborates_on: ["data modeling", "performance tuning"]
        defers_to: "auth-specialist-agent for user permissions"
        
      ai-instruction-agent:
        owns: ["prompt engineering", "AI personality", "model coordination"]
        collaborates_on: ["user experience", "chat optimization"]
        defers_to: "ux-design-agent for conversion psychology"
        
    conflict_resolution_hierarchy:
      1: "user_always_decides_on_conflicts"
      2: "business_requirements_over_technical_preferences"
      3: "dutch_market_requirements_over_generic_solutions"
      4: "performance_over_convenience"
      5: "type_safety_over_quick_fixes"
  
  proactive_suggestions:
    intensity: "high"  # Testing phase
    timing: "between_major_steps"
    conflict_aware: true  # Don't suggest if will cause specialist conflicts
    
# DEBUG MODE TRIGGERS
debug_mode:
  activation_triggers:
    keywords: ["debug mode", "verbose", "detailed", "show me everything"]
    failure_threshold: "3rd_consecutive_attempt"
    user_request: "debug this"
    
  specialist_debug_behavior:
    t3-specialist-agent:
      show: ["full_trpc_error_stack", "typescript_compilation_errors", "component_render_issues"]
      research: "context7_latest_next_docs_and_trpc_issues"
      
    ui-specialist-agent:
      show: ["css_conflicts", "responsive_breakpoints", "schedule_x_integration_issues"]
      research: "firecrawl_schedule_x_examples_and_tailwind_issues"
      
    database-specialist-agent:
      show: ["rls_policy_violations", "query_performance", "multi_tenant_isolation_issues"]
      research: "supabase_mcp_debugging_and_context7_rls_patterns"
      
    security-specialist-agent:
      show: ["semgrep_full_scan_results", "gdpr_compliance_gaps", "auth_flow_issues"]
      research: "context7_clerk_debugging_and_gdpr_latest_requirements"

# EMERGENCY MODE TRIGGERS  
emergency_mode:
  activation_triggers:
    keywords: ["production broken", "urgent", "critical", "emergency", "site down"]
    user_stress_indicators: ["help", "asap", "immediately", "broken"]
    
  specialist_emergency_behavior:
    skip_research_phase: true
    use_cached_patterns_only: true
    minimal_documentation: true
    focus_on_fix_first: true
    
    priority_specialists:
      1: "t3-specialist-agent"    # Core functionality
      2: "database-specialist-agent"  # Data integrity  
      3: "security-specialist-agent"  # Security fixes
      # Skip others unless explicitly needed

# PERFORMANCE
performance:
  pattern_cache: "24h"
  specialist_prep_time: "<8s"
  emergency_mode_prep: "<5s"
  debug_mode_prep: "<15s"