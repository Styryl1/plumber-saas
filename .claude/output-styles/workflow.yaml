# OPTIMIZED WORKFLOW v4.0 - Complete 9-Phase System with Mandatory Stops
version: "4.0.0"
enforcement: "strict_comprehensive"

# PHASE CONTROL - MANDATORY STOPS
phase_control:
  mandatory_stops: true
  stop_after_each_phase: true
  stop_message: "⏸️ Phase {n}/9 complete. Next would be: {next_phase}. Continue?"
  show_next_action: true
  wait_for_explicit_confirmation: true
  never_race_ahead: true

# VISUAL FEEDBACK - MAXIMUM LEVEL  
visual_feedback:
  level: "maximum"
  show_reasoning: true
  show_alternatives: true
  show_probability: true
  show_agent_transparency: true
  
  phase_display_format: |
    [PHASE {n}/9] {NAME} | Next: {next_phase}
    📊 Activity: {current_action}
    🔍 Source: {tool_or_agent_used}
    ⏱️ Elapsed: {time}s | Found: {results_count} results
    ⚠️ Consider crawling: {suggested_urls}
    
    ⏸️ Awaiting your guidance...

  agent_transparency_format: |
    🤖 DELEGATING TO: {agent_name}
    📍 Agent searching: {source_name}
    🎯 Why selected: {selection_reason}
    📝 Found: {findings_summary}
    🔗 Suggest crawling: {urls_list}

# 9-PHASE WORKFLOW DEFINITIONS
phases:
  phase_1_plan_mode:
    name: "PLAN MODE"
    mandatory: true
    activities: 
      - "Load CLAUDE.md and active PRPs"
      - "Check Archon health (if available)"
      - "Ask clarifying questions ALWAYS"
      - "Identify scope, integration, edge cases"
      - "Consider Dutch market requirements"
    triggers:
      - "ANY new user request"
      - "Plan mode keyword detected"
    output: "Clear understanding with all questions answered"
    next_phase: "Research"
    
  phase_2_research:
    name: "RESEARCH"  
    mandatory: true
    activities:
      - "Check Archon knowledge base (if available)"
      - "ALWAYS delegate to specialist agents"
      - "Agents use Context7/Firecrawl/other MCP tools"
      - "Show agent source selection reasoning"
      - "Identify URLs for potential crawling"
    tools: ["Context7 via agents", "Firecrawl via agents", "Task tool"]
    delegation_required: true
    output: "All knowledge needed for implementation"
    next_phase: "PRP Creation"
    
  phase_3_prp:
    name: "PRP CREATION"
    mandatory: false
    activities:
      - "Create/update PRP document"
      - "Document research findings"
      - "Plan implementation steps"
      - "Create Archon tasks (if available)"
    decision_logic: "Create for complex multi-step features only"
    skip_conditions: ["Simple single tasks", "Minor updates"]
    output: "Documented plan with clear steps"
    next_phase: "Implementation"
    
  phase_4_implementation:
    name: "IMPLEMENTATION"
    mandatory: true
    activities:
      - "Use ONLY researched approaches"
      - "Stop if <95% certain about anything"
      - "Show alternatives considered"
      - "Explain probability of success"
      - "Display reasoning for choices"
    rule_enforcement: "all_13_golden_rules"
    violation_response: "immediate_stop_with_dramatic_alert"
    certainty_threshold: 0.95
    output: "Complete implementation with explanations"
    next_phase: "Test Loop"
    
  phase_5_test_loop:
    name: "TEST LOOP"
    mandatory: true
    activities:
      - "MANDATORY Playwright MCP testing"
      - "Show each test iteration"
      - "Max 3 attempts before escalation"
      - "Loop until verified working"
    tools: ["Playwright MCP"]
    max_attempts: 3
    show_progress: true
    no_theoretical: "Only real working validation"
    output: "Tested, verified working feature"
    next_phase: "Debug (if needed) or PRP Update"
    
  phase_6_debug:
    name: "DEBUG"
    mandatory: false
    activities:
      - "Research-based fixes only"
      - "NO quick fixes or shortcuts"
      - "Max 3 attempts total"
      - "Escalate with detailed summary"
    activation: "Only when Phase 5 fails"
    max_attempts: 3
    no_specialist_debug: true
    escalation_format: "Show all attempts and ask user"
    next_phase: "PRP Update"
    
  phase_7_update_prp:
    name: "UPDATE PRP"
    mandatory: false  
    activities:
      - "Document what actually worked"
      - "Note any pattern modifications needed"
      - "Capture lessons learned"
      - "Update for future reference"
    trigger: "After feature completion"
    output: "Updated PRP with real implementation details"
    next_phase: "Update Archon"
    
  phase_8_update_archon:
    name: "UPDATE ARCHON"
    mandatory: false
    activities:
      - "Update task status in Archon (if available)"
      - "Add discoveries to knowledge base"
      - "Mark completions and blockers"
      - "Sync with project status"
    dependency: "Archon MCP availability"
    fallback: "Update local todo tracking"
    output: "Synchronized project status"
    next_phase: "Commit"
    
  phase_9_commit:
    name: "COMMIT"
    mandatory: true
    activities:
      - "Run Semgrep security scan"
      - "Create git commit with descriptive message"
      - "Push to GitHub if configured"
      - "Create rollback point"
    security_scan: "mandatory_semgrep_before_commit"
    git_message_format: |
      feat: {brief_description}
      
      {business_impact_and_details}
      
      🤖 Generated with [Claude Code](https://claude.ai/code)
      Co-Authored-By: Claude <noreply@anthropic.com>
    output: "Committed and safely stored changes"
    
# RESEARCH DELEGATION SYSTEM
research_delegation:
  always_use_agents: true
  never_direct_research: true
  show_source_selection: true  
  explain_why_selected: true
  suggest_crawl_urls: true
  save_context_window: true
  
  agent_selection_criteria:
    ui_tasks: "ui-specialist-agent"
    t3_implementation: "t3-specialist-agent" 
    database_operations: "database-specialist-agent"
    ai_integration: "ai-specialist-agent"
    authentication: "auth-specialist-agent"
    payments: "payment-specialist-agent"
    security: "security-specialist-agent"
    testing: "testing-specialist-agent"
    
# ARCHON INTEGRATION
archon_integration:
  primary_task_management: true
  health_check_on_start: true
  auto_create_tasks: true
  update_frequency: "after_each_completed_task"
  fallback_when_unavailable: "local_todo_tracking"
  priority: "archon_first_todowrite_secondary"

# MCP TOOLS ENFORCEMENT  
mcp_enforcement:
  all_tools_mandatory: true
  playwright_testing: "required_for_all_implementations"
  semgrep_security: "before_every_commit"
  context7_via_agents: "for_all_documentation_needs"
  firecrawl_via_agents: "for_working_examples"
  shadcn_for_ui: "all_ui_components"
  supabase_operations: "database_interactions"
  clerk_auth: "authentication_management"
  exa_search: "competitive_research"
  
# GOLDEN RULES ENFORCEMENT - ALL VIOLATIONS STOP
golden_rules_enforcement:
  violation_response: "immediate_stop"
  violation_display: "dramatic_alert_with_explanation"
  
  violation_format: |
    🚨🚨🚨 GOLDEN RULE VIOLATION 🚨🚨🚨
    ═══════════════════════════════════
    Rule #{rule_number}: {rule_name}
    Violation: {what_happened}  
    Should do: {correct_action}
    ═══════════════════════════════════
    Stopping work. How should I proceed?
  
  rules:
    rule_1: "Check Archon health before ANY task action"
    rule_2: "NO quick fixes - research if <95% certain"
    rule_3: "Stop after each phase for guidance"
    rule_4: "Questions ALWAYS in plan mode"
    rule_5: "Research via agents ONLY"
    rule_6: "NO mock data - real API or loading states"
    rule_7: "Type safety absolute - no 'any' types"
    rule_8: "Comprehensive over quick - show reasoning"
    rule_9: "Git checkpoints after progress"
    rule_10: "Security scans and GDPR compliance"
    rule_11: "Explain everything - show WHY"
    rule_12: "Context always fresh - reload files"
    rule_13: "ALL MCP tools mandatory"

# ERROR HANDLING & RECOVERY
error_handling:
  max_debug_attempts: 3
  escalation_after_failures: "detailed_summary_and_user_consultation"
  no_infinite_loops: "3_strike_rule_enforcement"
  preserve_progress: "always_maintain_working_state"
  
  emergency_mode:
    triggers: ["production broken", "urgent", "critical", "emergency"]
    skip_phases: ["prp_creation", "update_prp", "update_archon"]  
    focus: "fix_first_document_later"
    mandatory_phases: ["test_loop", "commit"]

# PATTERN SYSTEM - REMOVED
# Note: Local pattern system removed as requested
# All patterns now come from agent research and MCP tools
pattern_system:
  local_patterns: "disabled"
  success_tracking: "disabled"  
  validation: "via_agent_research_only"
  storage: "no_local_storage"

# DUTCH MARKET INTEGRATION
dutch_market:
  btw_validation: "automatic_21_9_percent_checking"  
  ideal_payments: "mollie_integration_preferred"
  gdpr_compliance: "mandatory_for_all_data_operations"
  terminology_checking: "dutch_plumber_terms_validation"
  
# SUCCESS METRICS - SIMPLIFIED
success_metrics:
  rule_compliance: "zero_violations_per_session"
  phase_completion: "all_mandatory_phases_completed"
  mcp_utilization: "all_required_tools_used"
  dutch_compliance: "gdpr_and_btw_requirements_met"
  user_guidance: "stopped_after_every_phase"